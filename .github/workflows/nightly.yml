name: Nightly / Beta Build

on:
  push:
    tags:
      - "test-v*" 
    branches:
      - develop # Auto-nightly on every push to dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive # Fixes the empty dependency folders!

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: "6.10.2"
          arch: "win64_msvc2022_64"

      # --- Build ---
      - name: Configure CMake
        run: >
          cmake -S . -B build -G "Ninja Multi-Config"

      - name: Build (Release)
        run: >
          cmake --build build --config Release --target WindowManager

      - name: Deploy Qt DLLs
        run: windeployqt6 build\Release\WindowManager.exe

      # --- Generate Auto-Tag with Date & Time ---
      - name: Set nightly tag and name
        id: nightly_meta
        shell: pwsh
        run: |
          # 1. Read the base version from CMakeLists.txt
          $cmakeText = Get-Content -Path "CMakeLists.txt" -Raw
          if ($cmakeText -match 'set\(\s*APP_VERSION\s+"([^"]+)"\s*\)') {
              $baseVersion = $matches[1]
          } else {
              Write-Error "Could not find APP_VERSION in CMakeLists.txt"
              exit 1
          }

          # 2. Get the current date and time
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"

          # 3. Combine them into the final tag and release name
          $tag = "v$baseVersion-nightly-$timestamp"
          $name = "Nightly v$baseVersion ($timestamp)"
          
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "name=$name" >> $env:GITHUB_OUTPUT

      # --- Package and Release ---
      - name: Package Artifacts
        shell: pwsh
        env:
          NIGHTLY_TAG: ${{ steps.nightly_meta.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:GITHUB_WORKSPACE"
          
          $buildDir = Join-Path $root 'build\Release'
          $outDir   = Join-Path $root "WindowManager-nightly"
          
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          
          # Executable
          Copy-Item "$buildDir\WindowManager.exe" $outDir -Force
          # Qt runtime DLLs deployed by windeployqt6
          Copy-Item "$buildDir\*.dll" $outDir -Force
          # Qt platforms directory (for qwindows.dll)
          if (Test-Path "$buildDir\platforms") {
            Copy-Item "$buildDir\platforms" $outDir -Recurse -Force
          }
          
          # Common files
          Copy-Item "$root\README.md" $outDir -Force
          Copy-Item "$root\LICENSE*" $outDir -Force
          
          # Compress to ZIP
          $zip = "$root\WindowManager-$env:NIGHTLY_TAG.zip"
          Compress-Archive -Path "$outDir\*" -DestinationPath $zip -Force
          
          # SHA256 checksum (two-space separator matches sha256sum standard)
          $hash = (Get-FileHash "$outDir\WindowManager.exe" -Algorithm SHA256).Hash.ToUpper()
          Set-Content -Path "$root\WindowManager-$env:NIGHTLY_TAG.sha256" -Value "$hash  WindowManager.exe"

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.nightly_meta.outputs.tag }}
          name: ${{ steps.nightly_meta.outputs.name }}
          body: |
            **Beta / Nightly build** — use at your own risk.
            
            Download and extract the ZIP before running WindowManager.
            Verify the SHA256 checksums with the included .sha256 file.
          files: |
            WindowManager-*.zip
            WindowManager-*.sha256
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: WindowManager-*.zip
          