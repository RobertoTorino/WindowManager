site_name: WindowManager
site_description: Tame the windows of games and emulators on Windows, and of Proton games on Linux (beta).
site_url: https://robertotorino.github.io/WindowManager/
repo_url: https://github.com/RobertoTorino/WindowManager
repo_name: RobertoTorino/WindowManager
edit_uri: edit/main/docs/
copyright: WindowManager is free software under the GPL-3.0. Not affiliated with Microsoft, NVIDIA, AMD, Intel, Valve or any game publisher.
docs_dir: docs
# docs/help/ holds the short in-app help pages (embedded in the exe); the wiki has the full pages.
exclude_docs: |
  help/

theme:
  name: material   # needs `pip install mkdocs-material`
  custom_dir: overrides
  logo: assets/icon.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/RobertoTorino/WindowManager
      name: WindowManager on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  anchors: warn

nav:
  - Home: index.md
  - Get started:
      - Download and install: wiki/install.md
      - First steps: wiki/getting-started.md
      - The main window: wiki/the-window.md
  - Using the app:
      - Games and launching: wiki/games-and-launching.md
      - Window controls: wiki/window-controls.md
      - Fit to monitor: wiki/fit-to-monitor.md
      - Downscaled view: wiki/downscaled-view.md
      - Display settings: wiki/display-settings.md
      - Game config: wiki/game-config.md
      - Focus, mouse and hotkeys: wiki/focus-and-hotkeys.md
      - Game info overlay and floating bar: wiki/game-stats.md
      - Reports: wiki/reports.md
      - GPU and power: wiki/gpu-and-power.md
      - HelixSR: wiki/helixsr.md
      - Magpie: wiki/magpie.md
      - Linux (beta): wiki/linux.md
  - Reference:
      - Shortcuts: wiki/shortcuts.md
      - Files and settings: wiki/files.md
      - Logs and troubleshooting: wiki/logs-and-troubleshooting.md
      - Safety: wiki/safety.md
      - Window terms: wiki/window-terms.md
  - Development:
      - Building and testing: development/building.md
      - Code layout: ARCHITECTURE.md
      - The docs site: development/docs-site.md
      - Linux port notes: LINUX_PORT.md
      - HelixSR 2.x: HELIXSR_2.md
      - Magpie (analysis): MAGPIE.md
